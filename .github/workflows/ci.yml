name: CI

# H7. Two automatic gates, plus one manual one:
#
#   frontend — the production Vite build compiles.          every push + PR
#   backend  — the 64 checks in backend/tests/*.mjs run     every push + PR
#              against a real server and the DEV Supabase
#              project.
#   smoke    — 13 read-only checks against LIVE PRODUCTION.  MANUAL ONLY
#
# The backend suites are not unit tests. They boot the API on :4000, sign
# in as the six seeded accounts from supabase/seed.sql, and write and
# delete real rows. That means they need real credentials, and they need
# the SEEDED project — see the guard in "Verify the CI secrets" below.
#
# The smoke job is workflow_dispatch-only on purpose: it is the only job
# here that touches production, and production now holds real user data.
# Read-only or not, hitting it is a decision, not a side effect of a push.
#
# What CI still does NOT cover: supabase/tests/rls.test.sql (psql-driven,
# no npm script, stays manual). See docs/deployment.md.

on:
  pull_request:
  push:
    branches: [main]
  # So a human can re-run CI straight after adding the repository secrets,
  # without having to invent a commit.
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run for the same branch when a new commit lands.
#
# A manual dispatch is deliberately given its OWN group, keyed by run id. A
# dispatch now also runs the production smoke test, and a run someone asked
# for by hand must not be cancelled by an unrelated push — nor cancel one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # No VITE_* variables are supplied here, and that is deliberate.
      #
      # Vite inlines them at build time, so a bundle built in CI would
      # carry whatever CI had — which is nothing. The app tolerates that
      # at build time (frontend/src/lib/supabase.js only throws when the
      # module is imported in a browser), so this step is a COMPILE CHECK
      # and nothing more.
      #
      # RE-VERIFIED with frontend/.env and frontend/.env.production both
      # moved aside and no VITE_* in the shell — the exact shape of a fresh
      # CI checkout, since both files are gitignored. `npm run build` exits
      # 0, 122 modules transformed. The resulting bundle falls back to
      # `localhost:4000` and contains no Supabase URL at all, which is the
      # proof that it is a compile check and NOT a deployable artifact.
      #
      # It is therefore deliberately not uploaded as an artifact. The real
      # production bundle is built on a developer machine from
      # frontend/.env.production — see docs/deployment.md.
      - name: npm run build
        run: npm run build

  backend:
    name: Backend suites (dev Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Fork pull requests get no secrets, so this job could only ever fail
    # for them — a permanently red check that says nothing about the code.
    # The repo is public, so that is a live possibility. Skip it there; a
    # fork's first backend run is the push to main after the merge.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: backend

    # Repo-wide serialisation, on purpose. Every backend suite shares one
    # mutable resource — the seeded dev Supabase project — and they create
    # and delete invitations, boards, lists and cards under fixed seed IDs.
    # Two runs at once would interfere and produce failures that say
    # nothing about the commit.
    #
    # Cost of this: if a run is executing and two more queue up, GitHub
    # cancels the older pending one. A CANCELLED backend job means
    # "superseded while waiting", not "broken".
    concurrency:
      group: backend-suites-dev-supabase
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >=20.6 for `node --env-file`, which every test script uses.
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Only two secrets exist, and only these two are secrets.
      #
      # CORS_ORIGINS and APP_URL are written literally further down: no
      # suite reads either one (the API is called from Node with no Origin
      # header, and I11 only asserts that inviteUrl is non-empty, never its
      # value), and neither value is sensitive. Making them repository
      # secrets would only mean two more ways for CI to be red for a reason
      # that has nothing to do with the commit.
      - name: Verify the CI secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::CI cannot run the backend suites without them."
            echo "::error::See the 'CI' section of docs/deployment.md for what each value is and where to get it."
            exit 1
          fi

          # Hard stop if anyone ever points CI at production.
          #
          # These suites sign in as seeded accounts and write AND DELETE
          # rows under fixed seed IDs. Prod (ajkzoiqsvcibvcodkuzs) now holds
          # real user accounts and workspaces created by actual people; dev
          # (hjylkhswlwqiwvztynkw) is the seeded one. A wrong secret here
          # would turn every CI run into an attempt to write to live data.
          # Verified locally: this guard exits 1 on the prod ref, and the
          # missing-secret branch above exits 1 when GitHub injects the
          # secrets as empty strings, which is what an absent secret is.
          if printf '%s' "$SUPABASE_URL" | grep -q 'ajkzoiqsvcibvcodkuzs'; then
            echo "::error::SUPABASE_URL points at the PRODUCTION Supabase project (ajkzoiqsvcibvcodkuzs)."
            echo "::error::The backend suites write rows. They must only ever run against dev (hjylkhswlwqiwvztynkw)."
            exit 1
          fi
          echo "secrets present; target project is not prod"

      # devDependencies are required: socket.io-client is a devDependency
      # and three of the four suites import it. Do not set NODE_ENV before
      # this step.
      - name: npm ci
        run: npm ci

      # backend/.env is gitignored, so CI has to materialise one. It is
      # not optional plumbing: every script in backend/package.json is
      # `node --env-file=.env …`, so the suites cannot start without this
      # file even though the values are already in the environment.
      #
      # NODE_ENV stays `test`: `production` activates the CORS_ORIGINS="*"
      # boot guard in backend/src/config/env.js, which is a production
      # concern and would only obscure failures here.
      - name: Write backend/.env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            echo "PORT=4000"
            echo "NODE_ENV=test"
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "APP_URL=http://localhost:5173"
          } > .env
          echo "wrote backend/.env with $(wc -l < .env) keys"

      # SERVER_PID crosses a step boundary via $GITHUB_ENV, which is the one
      # piece of this job that cannot be exercised outside Actions. It was
      # reproduced locally with a stand-in $GITHUB_ENV sourced between steps
      # and it does carry: the value is npm's pid, not node's — see "Stop
      # the API" at the bottom, which is why that step kills children too.
      #
      # The background process survives the step because both its streams
      # are redirected to a file; a step that leaves a pipe open to a
      # background child is the version of this that hangs.
      - name: Start the API on :4000 and wait for /health
        run: |
          npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          echo "SERVER_PID=$pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then
              echo "API healthy on :4000"
              exit 0
            fi
            # config/env.js throws at boot on a missing key, so a dead
            # process here is a real failure, not a slow start. Say so now
            # instead of burning the rest of the timeout.
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::The API exited before becoming healthy. Server log:"
              cat "$RUNNER_TEMP/server.log" || true
              exit 1
            fi
            sleep 1
          done
          echo "::error::API never became healthy on :4000 within 30s. Server log:"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1

      # realtime (9) + invitations (12) + kanban (18) + hardening (25,
      # H1–H5) = 64. Each suite calls process.exit(1) when any assertion
      # fails and package.json chains them with &&, so one failed check
      # fails the job.
      - name: npm test
        run: npm test

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

      # Cosmetic on a hosted runner — the VM is destroyed either way — but
      # it is the step anyone reproducing this job locally relies on, and as
      # written it did not work. $SERVER_PID is the pid of the `npm`
      # wrapper, and the API is npm's child; SIGTERM to npm left the node
      # process alive and holding :4000. Kill the children first, then the
      # wrapper. Both are `|| true`: the process being gone already is the
      # success case, and this step must never be what turns a job red.
      - name: Stop the API
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            pkill -P "$SERVER_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          fi

  smoke:
    name: Production smoke test (read-only, manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # MANUAL ONLY. Actions → CI → Run workflow.
    #
    # Every other job in this file runs against dev. This one runs against
    # the live Netlify site, the live Railway API and the prod Supabase
    # project — which now contain real user accounts and workspaces. The
    # script is read-only and audited to stay that way (see the header of
    # scripts/smoke-prod.mjs), but "read-only" is not the same as "free":
    # it is traffic against a system real people are using, so it happens
    # when someone asks for it. Run it after a production deploy.
    #
    # Note that dispatching this workflow also re-runs frontend and backend.
    # That is intended — a manual run is "check everything".
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # No `cache:` here on purpose. There is no package.json at the
          # repo root and the script has zero dependencies — it uses global
          # fetch only — so there is no lockfile to key a cache on and
          # nothing to install. Setting cache: npm would fail the step.
          node-version: '20'

      # SMOKE_SUPABASE_ANON is optional in the sense that the other eleven
      # checks do not need it — but the script treats its absence as a
      # FAILURE, not a skip, and exits non-zero. That is deliberate: a
      # smoke test that quietly shrinks when a key is missing is worse than
      # one that goes red. This step exists so the red says why in one line
      # instead of leaving someone to decode "P12 skipped".
      - name: Note whether the optional prod anon key is present
        env:
          SMOKE_SUPABASE_ANON: ${{ secrets.SMOKE_SUPABASE_ANON }}
        run: |
          if [ -z "$SMOKE_SUPABASE_ANON" ]; then
            echo "::warning::Repository secret SMOKE_SUPABASE_ANON is not set."
            echo "::warning::P12/P13 (prod auth reachable, auth rejects a non-existent account) will FAIL, and the job will be red, even if the other 11 checks pass."
            echo "::warning::Set it to the PRODUCTION Supabase anon key — public by design, RLS is the protection. See the 'CI' section of docs/deployment.md."
          else
            echo "SMOKE_SUPABASE_ANON present; all 13 checks will run"
          fi

      # SMOKE_FRONTEND / SMOKE_API / SMOKE_SUPABASE are left unset so the
      # script uses its own built-in production defaults. Overriding them
      # here would mean this job could silently stop testing production.
      - name: node scripts/smoke-prod.mjs
        env:
          SMOKE_SUPABASE_ANON: ${{ secrets.SMOKE_SUPABASE_ANON }}
        run: node scripts/smoke-prod.mjs
